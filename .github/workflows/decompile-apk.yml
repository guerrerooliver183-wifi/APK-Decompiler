
name: Parallel APK Decompilation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-decompilation
  cancel-in-progress: false

jobs:
  jadx:
    name: Decompile with JADX
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq unzip file

          URL="$(
            curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest |
            jq -er '[.assets[] |
              select(.name | test("^jadx-.*\\.zip$"))][0].browser_download_url'
          )"

          curl -fsSL "$URL" -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx

          BIN="$(find /opt/jadx -type f \
            -path '*/bin/jadx' | head -n 1)"
          test -n "$BIN"
          sudo chmod +x "$BIN"
          sudo ln -sf "$BIN" /usr/local/bin/jadx
          jadx --version

      - name: Download APK
        env:
          APK_URL: ${{ secrets.APK_URL }}
        run: |
          set -euo pipefail
          test -n "$APK_URL"
          curl -fLsS --retry 3 "$APK_URL" -o app.apk
          test -s app.apk
          file app.apk

      - name: Run JADX
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/jadx

          set +e
          jadx --threads-count 2 -d output/jadx app.apk
          STATUS=$?
          set -e

          echo "JADX exit code: $STATUS"

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
            echo "::error::JADX failed."
            exit "$STATUS"
          fi

          if ! find output/jadx -type f -print -quit | grep -q .; then
            echo "::error::JADX produced no files."
            exit 1
          fi

          if [ "$STATUS" -eq 3 ]; then
            echo "::warning::JADX produced partial output."
          fi

      - name: Upload JADX output
        uses: actions/upload-artifact@v4
        with:
          name: jadx-output
          path: output/jadx/
          if-no-files-found: error
          retention-days: 3

  apktool:
    name: Decode with Apktool
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq file

          URL="$(
            curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -er '[.assets[] |
              select(.name | test("^apktool_[0-9].*\\.jar$"))][0].browser_download_url'
          )"

          curl -fsSL "$URL" -o /tmp/apktool.jar
          sudo install -m 0644 /tmp/apktool.jar \
            /usr/local/bin/apktool.jar

          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download APK
        env:
          APK_URL: ${{ secrets.APK_URL }}
        run: |
          set -euo pipefail
          test -n "$APK_URL"
          curl -fLsS --retry 3 "$APK_URL" -o app.apk
          test -s app.apk
          file app.apk

      - name: Decode APK
        run: |
          set -euo pipefail
          mkdir -p output/apktool
          apktool d --force -o output/apktool app.apk

          if ! find output/apktool -type f -print -quit | grep -q .; then
            echo "::error::Apktool produced no files."
            exit 1
          fi

      - name: Upload Apktool output
        uses: actions/upload-artifact@v4
        with:
          name: apktool-output
          path: output/apktool/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish both results
    runs-on: ubuntu-latest
    needs: [jadx, apktool]
    timeout-minutes: 15

    steps:
      - name: Download JADX result
        uses: actions/download-artifact@v4
        with:
          name: jadx-output
          path: output/jadx

      - name: Download Apktool result
        uses: actions/download-artifact@v4
        with:
          name: apktool-output
          path: output/apktool

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DEST_REPO }}
          token: ${{ secrets.DEST_TOKEN }}
          ref: main
          path: destination

      - name: Prepare and replace results
        shell: bash
        run: |
          set -euo pipefail

          for dir in jadx apktool; do
            src="output/$dir"
            dst="destination/decompiled/$dir"

            mkdir -p "$dst"

            if find "$src" -type f -print -quit | grep -q .; then
              echo "Replacing $dst"
              rsync -a --delete "$src/" "$dst/"
            else
              echo "::warning::No files in $src; keeping old results."
            fi
          done

      - name: Commit and push
        working-directory: destination
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- decompiled/

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update decompiled APK sources"
          git push origin HEAD:main
