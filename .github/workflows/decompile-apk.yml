
name: Download, Decompile and Publish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: decompile-apk
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

          # Install JADX from its official GitHub release.
          JADX_URL="$(
            curl -fsSL \
              https://api.github.com/repos/skylot/jadx/releases/latest |
            jq -er \
              '[.assets[] | select(.name | test("^jadx-.*\\.zip$"))][0].browser_download_url'
          )"

          curl -fsSL "$JADX_URL" -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx

          JADX_BIN="$(find /opt/jadx -type f -path '*/bin/jadx' | head -n 1)"
          test -n "$JADX_BIN"
          sudo chmod +x "$JADX_BIN"
          sudo ln -sf "$JADX_BIN" /usr/local/bin/jadx

          # Install Apktool from its official GitHub release.
          APKTOOL_URL="$(
            curl -fsSL \
              https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -er \
              '[.assets[] | select(.name | test("^apktool_[0-9].*\\.jar$"))][0].browser_download_url'
          )"

          curl -fsSL "$APKTOOL_URL" \
            -o /tmp/apktool.jar

          sudo install -m 0644 /tmp/apktool.jar \
            /usr/local/bin/apktool.jar

          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

          jadx --version
          apktool --version

      - name: Download APK
        env:
          APK_URL: ${{ secrets.APK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_URL"
          curl --fail --location --silent --show-error \
            --retry 3 \
            "$APK_URL" \
            --output app.apk

          test -s app.apk
          file app.apk
          sha256sum app.apk

      - name: Decompile with JADX
        run: |
          set -euo pipefail
          mkdir -p output/jadx
          jadx --threads-count 2 \
            -d output/jadx app.apk

      - name: Decode with Apktool
        run: |
          set -euo pipefail
          apktool d --force \
            -o output/apktool app.apk

      - name: Add metadata
        shell: bash
        run: |
          {
            echo "# APK analysis"
            echo
            echo "- Source: configured APK_URL secret"
            echo "- SHA-256: $(sha256sum app.apk | cut -d ' ' -f 1)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Date (UTC): $(date -u +%FT%TZ)"
          } > output/README.md

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DEST_REPO }}
          token: ${{ secrets.DEST_TOKEN }}
          ref: main
          path: destination
          persist-credentials: true

      - name: Publish results
        env:
          TARGET_DIR: destination/decompiled
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TARGET_DIR"
          rsync -a --delete output/ "$TARGET_DIR/"

          cd destination
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add decompiled/

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update decompiled APK sources"
          git push origin HEAD:main
